name: Generate GitHub README Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2.0.0
        with:
          card: stats
          options: "username=DannyPhongcoderso1&show_icons=true&theme=dracula&hide_border=false"
          path: "assets/github-stats.svg"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.0.0
        with:
          card: top-langs
          options: "username=DannyPhongcoderso1&layout=compact&langs_count=6&theme=dracula&hide_border=false"
          path: "assets/top-langs.svg"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git commit -m "Update GitHub stats SVG" || exit 0
          git push
